<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KYC Verification — Kisan Setu</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌾</text></svg>">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .kyc-status-box { text-align: center; padding: 32px; border-radius: var(--radius); margin-bottom: 24px; background: rgba(255,255,255,0.92); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); border: 1px solid var(--glass-border); }
    .kyc-status-box.pending { background: rgba(255,255,255,0.92); border: 1px solid rgba(255,255,255,0.7); }
    .kyc-status-box.verified { background: rgba(255,255,255,0.92); border: 1px solid rgba(255,255,255,0.7); }
    .kyc-status-box.rejected { background: rgba(255,255,255,0.92); border: 1px solid rgba(255,255,255,0.7); }
    .kyc-status-box .status-icon { font-size: 3rem; margin-bottom: 10px; }
    .kyc-status-box h2 { margin-bottom: 6px; }
    .kyc-status-box p { color: var(--text-muted); }
    .doc-preview { max-width: 400px; max-height: 300px; border: 1px solid var(--border); border-radius: 10px; margin-top: 12px; }
    .upload-area { border: 2px dashed var(--border); border-radius: var(--radius); padding: 40px 20px; text-align: center; cursor: pointer; transition: all 0.25s ease; background: rgba(255,255,255,0.88); }
    .upload-area:hover { border-color: var(--green); background: rgba(90,158,126,0.04); }
    .upload-area .upload-icon { font-size: 2.5rem; margin-bottom: 10px; }
    .upload-area p { color: var(--text-muted); }
    .doc-type-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-bottom: 20px; }
    .doc-type-btn { padding: 12px; border: 2px solid var(--border); border-radius: var(--radius-sm); background: rgba(255,255,255,0.9); cursor: pointer; text-align: center; font-weight: 600; font-size: 0.9rem; transition: all 0.2s ease; -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
    .doc-type-btn:hover { border-color: var(--green); background: rgba(255,255,255,0.8); }
    .doc-type-btn.selected { border-color: var(--green); background: rgba(90,158,126,0.08); color: var(--green-dark); }
    .notes-box { background: rgba(184,146,58,0.08); border: 1px solid rgba(184,146,58,0.2); border-radius: var(--radius-sm); padding: 14px; margin-top: 16px; }
    .notes-box.rejected { background: rgba(196,90,90,0.08); border-color: rgba(196,90,90,0.2); }
  </style>
</head>
<body>
  <nav id="appNav" class="navbar" aria-label="Main navigation"></nav>

  <main>
    <div class="container" style="max-width: 700px; padding: 36px 18px 0;">
      <div class="page-header mb-3">
        <h1 class="page-title">KYC Verification</h1>
        <p class="muted">Upload your identity document to complete verification.</p>
      </div>

      <!-- Status Box -->
      <div id="kycStatusBox" class="kyc-status-box pending">
        <div class="status-icon">⏳</div>
        <h2>Loading...</h2>
        <p>Please wait</p>
      </div>

      <!-- Document Type Selection -->
      <div id="kycForm" class="card card-pad" style="display:none;">
        <h3 class="mb-2">Select document type</h3>
        <div class="doc-type-grid" id="docTypeGrid">
          <button type="button" class="doc-type-btn" data-type="aadhaar">🪪 Aadhaar Card</button>
          <button type="button" class="doc-type-btn" data-type="pan">💳 PAN Card</button>
          <button type="button" class="doc-type-btn" data-type="voterId">🗳️ Voter ID</button>
          <button type="button" class="doc-type-btn" data-type="drivingLicence">🚗 Driving Licence</button>
          <button type="button" class="doc-type-btn" data-type="passport">📘 Passport</button>
        </div>

        <div id="uploadSection" style="display:none;">
          <h3 class="mb-2">Upload document image</h3>
          <p class="small muted mb-3">Take a clear photo or scan of your document. Accepted: JPG, PNG (max 5MB)</p>
          <div class="upload-area" id="uploadArea">
            <div class="upload-icon">📷</div>
            <p><strong>Click to upload</strong> or drag and drop</p>
            <p class="small">JPG, PNG up to 5MB</p>
            <input type="file" id="docFile" accept="image/jpeg,image/png" style="display:none;">
          </div>
          <div id="previewSection" style="display:none; text-align:center;">
            <img id="docPreview" class="doc-preview" alt="Document preview">
            <div class="mt-2">
              <button type="button" class="btn btn-ghost btn-sm" id="removeDoc">Remove</button>
            </div>
          </div>
        </div>

        <div class="flex-between mt-4">
          <span></span>
          <button type="button" class="btn btn-primary btn-lg" id="submitKyc" disabled>
            Submit for Verification
          </button>
        </div>
      </div>

      <!-- Officer Notes -->
      <div id="officerNotes" class="notes-box" style="display:none;">
        <strong>Officer Note:</strong>
        <p id="officerNotesText" class="mt-1"></p>
      </div>
    </div>
  </main>

  <script src="/js/i18n.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/chatbot.js" defer></script>
  <script>
    window.initApp({ active: "kyc", requireRole: "farmer", loginRedirect: "/login" })
      .then(loadKycStatus);

    var selectedDocType = null;
    var selectedDocData = null;

    function loadKycStatus() {
      window.api("/api/kyc/status").then(function (data) {
        renderStatus(data);
      }).catch(function (e) {
        showToast(e.message, "error");
      });
    }

    function renderStatus(data) {
      var box = document.getElementById("kycStatusBox");
      var form = document.getElementById("kycForm");
      var notesBox = document.getElementById("officerNotes");
      var notesText = document.getElementById("officerNotesText");

      box.className = "kyc-status-box " + data.kyc;

      if (data.kyc === "verified") {
        box.innerHTML =
          '<h2>KYC Successfully Verified</h2>' +
          '<p>Your identity has been verified by ' + esc(data.verifiedBy || 'an officer') + '.' +
          (data.verifiedAt ? ' on ' + fmtDate(data.verifiedAt.split("T")[0]) : '') + '</p>';
        form.style.display = "none";
        notesBox.style.display = "none";
      } else if (data.kyc === "rejected") {
        box.innerHTML = '<div class="status-icon">❌</div>' +
          '<h2 style="color:#dc2626;">KYC Rejected</h2>' +
          '<p>Your document was rejected. Please review the note below and resubmit.</p>';
        form.style.display = "block";
        if (data.notes) {
          notesBox.className = "notes-box rejected";
          notesText.textContent = data.notes;
          notesBox.style.display = "block";
        }
      } else if (data.hasDoc) {
        box.innerHTML = '<div class="status-icon">⏳</div>' +
          '<h2 style="color:#d97706;">KYC Pending Review</h2>' +
          '<p>Your document has been submitted and is awaiting officer review.</p>';
        form.style.display = "none";
        notesBox.style.display = "none";
      } else {
        box.innerHTML = '<div class="status-icon">📋</div>' +
          '<h2>KYC Not Submitted</h2>' +
          '<p>Please upload your identity document below to start verification.</p>';
        form.style.display = "block";
        notesBox.style.display = "none";
      }
    }

    /* Document type selection */
    document.querySelectorAll(".doc-type-btn").forEach(function (btn) {
      btn.addEventListener("click", function () {
        document.querySelectorAll(".doc-type-btn").forEach(function (b) { b.classList.remove("selected"); });
        btn.classList.add("selected");
        selectedDocType = btn.getAttribute("data-type");
        document.getElementById("uploadSection").style.display = "block";
        updateSubmitBtn();
      });
    });

    /* File upload */
    var uploadArea = document.getElementById("uploadArea");
    var fileInput = document.getElementById("docFile");

    uploadArea.addEventListener("click", function () { fileInput.click(); });
    uploadArea.addEventListener("dragover", function (e) { e.preventDefault(); uploadArea.style.borderColor = "var(--green)"; });
    uploadArea.addEventListener("dragleave", function () { uploadArea.style.borderColor = ""; });
    uploadArea.addEventListener("drop", function (e) {
      e.preventDefault();
      uploadArea.style.borderColor = "";
      if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
    });

    fileInput.addEventListener("change", function () {
      if (fileInput.files.length) handleFile(fileInput.files[0]);
    });

    function handleFile(file) {
      if (!file.type.match(/^image\/(jpeg|png)$/)) {
        showToast("Please select a JPG or PNG image", "error");
        return;
      }
      if (file.size > 5 * 1024 * 1024) {
        showToast("File too large (max 5MB)", "error");
        return;
      }
      var reader = new FileReader();
      reader.onload = function (e) {
        selectedDocData = e.target.result;
        document.getElementById("docPreview").src = selectedDocData;
        document.getElementById("uploadArea").style.display = "none";
        document.getElementById("previewSection").style.display = "block";
        updateSubmitBtn();
      };
      reader.readAsDataURL(file);
    }

    document.getElementById("removeDoc").addEventListener("click", function () {
      selectedDocData = null;
      fileInput.value = "";
      document.getElementById("uploadArea").style.display = "";
      document.getElementById("previewSection").style.display = "none";
      updateSubmitBtn();
    });

    function updateSubmitBtn() {
      document.getElementById("submitKyc").disabled = !(selectedDocType && selectedDocData);
    }

    /* Submit */
    document.getElementById("submitKyc").addEventListener("click", function () {
      if (!selectedDocType || !selectedDocData) return;
      var btn = this;
      btn.disabled = true;
      btn.textContent = "Submitting…";

      window.api("/api/kyc/submit", {
        method: "POST",
        body: { docType: selectedDocType, docData: selectedDocData }
      }).then(function (res) {
        if (res.success) {
          showToast("Document submitted for verification!");
          loadKycStatus();
        }
      }).catch(function (e) {
        btn.disabled = false;
        btn.textContent = "Submit for Verification";
        showError(e.message);
      });
    });
  </script>
</body>
</html>
